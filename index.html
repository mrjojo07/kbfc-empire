<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBFC EMPIRE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .home {
      width: 100%;
      max-width: 420px;
      padding: 35px 22px;
      background: #1b1c21;
      border: 1px solid #33343b;
      border-radius: 22px;
    }
    .ball { font-size: 58px; }
    h1 {
      margin: 14px 0 8px;
      color: #ffcc22;
      font-size: 32px;
      letter-spacing: 1px;
    }
    p {
      color: #c6c6ce;
      margin-bottom: 30px;
    }
    .open {
      display: block;
      padding: 15px;
      border-radius: 12px;
      background: #ffcc22;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }
    .open:active { transform: scale(.98); }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #777984;
    }
  </style>
</head>
<body>
  <main class="home">
    <div class="ball">⚽</div>
    <h1>KBFC EMPIRE</h1>
    <p>Football Shorts Creator</p>
    <a class="open" href="./editor.html">🎬 Open Editor</a>
    <div class="footer">CREATE • EDIT • DOWNLOAD</div>
  </main>
</body>
</html>
