<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KBFC EMPIRE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:white;font-family:Arial,sans-serif;padding:18px}
main{max-width:520px;margin:auto}
h1{color:#ffc928;text-align:center}
p{color:#cbd0dc}
.card{background:#1c2230;padding:16px;border-radius:14px;margin:14px 0}
label{display:block;margin:14px 0 6px}
input,button{width:100%;padding:12px;border-radius:8px;border:0;margin-top:5px}
button{background:#ffc928;color:#151515;font-weight:bold;font-size:16px}
video{width:100%;max-height:420px;background:#000;border-radius:10px;margin-top:12px}
#status{white-space:pre-wrap;color:#ffc928}
</style>
</head>
<body>
<main>
<h1>⚽ KBFC EMPIRE</h1>
<p style="text-align:center">Football Shorts Creator</p>

<div class="card">
<label>Choose your video</label>
<input id="file" type="file" accept="video/*">
<video id="video" controls playsinline></video>

<label>Start time (seconds)</label>
<input id="start" type="number" min="0" value="0">

<label>End time (seconds)</label>
<input id="end" type="number" min="1" value="30">

<label>Brightness</label>
<input id="bright" type="range" min="50" max="150" value="100">

<label>Contrast</label>
<input id="contrast" type="range" min="50" max="150" value="100">

<button id="create">CREATE SHORT</button>
<p id="status">Choose a video to begin.</p>
<video id="result" controls playsinline></video>
<a id="download" style="display:none;color:#ffc928" download="KBFC-Empire-Short.webm">DOWNLOAD EDITED VIDEO</a>
</div>
</main>

<script>
const file=document.getElementById('file');
const video=document.getElementById('video');
const result=document.getElementById('result');
const status=document.getElementById('status');
const download=document.getElementById('download');
let sourceURL='';

file.onchange=()=>{
  const f=file.files[0];
  if(!f)return;
  if(sourceURL)URL.revokeObjectURL(sourceURL);
  sourceURL=URL.createObjectURL(f);
  video.src=sourceURL;
  video.load();
  status.textContent='Video loaded. Set start and end times.';
  download.style.display='none';
};

document.getElementById('create').onclick=async()=>{
  const f=file.files[0];
  if(!f){status.textContent='Please choose a video first.';return;}
  if(!video.videoWidth){status.textContent='Wait for the video to load, then try again.';return;}
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream){
    status.textContent='This browser does not support video export.';
    return;
  }

  const slowMotionSpeed = 0.5;
  const start=Math.max(0,Number(document.getElementById('start').value)||0);
  const end=Math.min(Number(document.getElementById('end').value)||30,video.duration);
  if(end<=start){status.textContent='End time must be greater than start time.';return;}

  const canvas=document.createElement('canvas');
  canvas.width=720;
  canvas.height=1280;
  const ctx=canvas.getContext('2d');
  const stream=canvas.captureStream(30);
  let audioContext=null;
  let audioSource=null;

  try{
    audioContext=new AudioContext();
    audioSource=audioContext.createMediaElementSource(video);
    const audioDestination=audioContext.createMediaStreamDestination();
    audioSource.connect(audioDestination);
    audioDestination.stream.getAudioTracks().forEach(t=>stream.addTrack(t));
  }catch(e){
    status.textContent='Audio setup failed. Reload the page and try again.';
    stream.getTracks().forEach(t=>t.stop());
    return;
  }

  let mime='video/webm;codecs=vp8,opus';
  if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';
  let recorder;
  try{
    recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000,audioBitsPerSecond:128000});
  }catch(e){
    status.textContent='Cannot start video export in this browser.';
    stream.getTracks().forEach(t=>t.stop());
    return;
  }

  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  recorder.onerror=()=>{
    status.textContent='Export failed. Try a shorter clip.';
  };
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'});
    const url=URL.createObjectURL(blob);
    result.src=url;
    download.href=url;
    download.style.display='block';
    status.textContent='Finished! Check the edited video below.';
    stream.getTracks().forEach(t=>t.stop());
    try{audioSource.disconnect();}catch(e){}
    if(audioContext)audioContext.close();
  };

  let raf=0;
  let stopped=false;
  const draw=()=>{
    if(stopped)return;
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,720,1280);
    const vw=video.videoWidth, vh=video.videoHeight;
    const scale = Math.min(720 / vw, 1280 / vh);
const dw = vw * scale;
const dh = vh * scale;
const dx = (720 - dw) / 2;
const dy = (1280 - dh) / 2;

ctx.fillStyle = "#000000";
ctx.fillRect(0, 0, 720, 1280);

ctx.filter = 'brightness(' +
  document.getElementById('bright').value +
  '%) contrast(' +
  document.getElementById('contrast').value + '%)';

ctx.drawImage(video, dx, dy, dw, dh);
ctx.filter = "none";
    if(video.currentTime>=end||video.ended){
      stopped=true;
      cancelAnimationFrame(raf);
      video.pause();
      if(recorder.state!=='inactive')recorder.stop();
      return;
    }
    raf=requestAnimationFrame(draw);
  };

  status.textContent='Preparing video... Keep this page open.';
  download.style.display='none';
  try{
    video.pause();
    video.currentTime=start;
    await new Promise((resolve,reject)=>{
      const timeout=setTimeout(()=>reject(new Error('seek timeout')),15000);
      video.addEventListener('seeked',()=>{clearTimeout(timeout);resolve();},{once:true});
    });
    await audioContext.resume();
    video.playbackRate = slowMotionSpeed;
    await video.play();
    recorder.start(1000);
    draw();
    status.textContent='Creating Short... Keep the screen on and do not leave this page.';
  }catch(e){
    stopped=true;
    if(recorder.state!=='inactive')recorder.stop();
    status.textContent='Could not start. Reload the page and try a shorter clip.';
  }
};
</script>
<script src="highlights.js"></script>
  <div style="padding:15px;background:#151515;color:white;border-radius:12px;margin:15px 0">
  <h3>🎨 Video Filters</h3>
  <select id="kbfcFilter" style="width:100%;padding:12px;margin-bottom:10px">
    <option value="none">Original</option>
    <option value="cinematic">Cinematic</option>
    <option value="vintage">Vintage</option>
    <option value="bw">Black &amp; White</option>
    <option value="warm">Warm</option>
    <option value="cool">Cool</option>
  </select>
  <h3>⚡ Effects</h3>
  <select id="kbfcEffect" style="width:100%;padding:12px">
    <option value="none">No Effect</option>
    <option value="glow">Glow</option>
    <option value="blur">Blur</option>
    <option value="bright">Flash / Bright</option>
  </select>
</div>
<script>
(function () {
  const filter = document.getElementById('kbfcFilter');
  const effect = document.getElementById('kbfcEffect');
  const video = document.getElementById('video');
  if (!filter || !effect || !video) return;

  function apply() {
    const filters = {
      none: 'none',
      cinematic: 'contrast(1.3) saturate(1.25)',
      vintage: 'sepia(0.5) contrast(1.1)',
      bw: 'grayscale(1)',
      warm: 'sepia(0.25) saturate(1.3)',
      cool: 'hue-rotate(15deg) saturate(1.1)'
    };
    const effects = {
      none: '',
      glow: ' brightness(1.15)',
      blur: ' blur(2px)',
      bright: ' brightness(1.5)'
    };
    video.style.filter =
      filters[filter.value] + effects[effect.value];
  }
  filter.addEventListener('change', apply);
  effect.addEventListener('change', apply);
})();
</script>

<style>
.kbfc-filters {
  background:#111827;color:white;padding:14px;
  border-radius:14px;margin:15px 0;
}
.kbfc-filter-grid {
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
}
.kbfc-filter-card {
  color:white;background:#252b38;border:2px solid transparent;
  border-radius:10px;padding:5px;cursor:pointer;
  text-align:center;font-size:12px;
}
.kbfc-filter-card.active {border-color:#22c55e;}
.kbfc-demo {
  width:100%;aspect-ratio:1/1;border-radius:7px;
  background:linear-gradient(135deg,#f5b942,#e94b3c 45%,#1769aa);
  position:relative;overflow:hidden;margin-bottom:6px;
}
.kbfc-demo:before {
  content:"⚽";position:absolute;left:32%;top:23%;
  font-size:35px;
}
.kbfc-demo:after {
  content:"KBFC";position:absolute;bottom:8px;left:0;right:0;
  font-weight:bold;font-size:19px;text-align:center;
  text-shadow:0 2px 5px black;
}
.kbfc-demo.cinema {filter:contrast(1.35) saturate(1.3);}
.kbfc-demo.vintage {filter:sepia(.8) contrast(1.1);}
.kbfc-demo.bw {filter:grayscale(1);}
.kbfc-demo.warm {filter:sepia(.3) saturate(1.5);}
.kbfc-demo.cool {filter:hue-rotate(25deg) saturate(1.2);}
.kbfc-demo.vivid {filter:saturate(2) contrast(1.1);}
</style>
<div class="kbfc-filters">
  <h3>🎨 Choose Your Filter</h3>
  <p style="font-size:12px;color:#cbd5e1">
    Tap a preview to apply it to your video
  </p>
  <div class="kbfc-filter-grid">
    <button class="kbfc-filter-card active" data-filter="none">
      <div class="kbfc-demo"></div>Original
    </button>
    <button class="kbfc-filter-card" data-filter="cinema">
      <div class="kbfc-demo cinema"></div>Cinematic
    </button>
    <button class="kbfc-filter-card" data-filter="vintage">
      <div class="kbfc-demo vintage"></div>Vintage
    </button>
    <button class="kbfc-filter-card" data-filter="bw">
      <div class="kbfc-demo bw"></div>B&W
    </button>
    <button class="kbfc-filter-card" data-filter="warm">
      <div class="kbfc-demo warm"></div>Warm
    </button>
    <button class="kbfc-filter-card" data-filter="cool">
      <div class="kbfc-demo cool"></div>Cool
    </button>
    <button class="kbfc-filter-card" data-filter="vivid">
      <div class="kbfc-demo vivid"></div>Vivid
    </button>
  </div>
  <p id="kbfcFilterStatus">Selected: Original</p>
</div>
<script>
(function () {
  const cards = document.querySelectorAll('.kbfc-filter-card');
  const video = document.getElementById('video');
  const styles = {
    none: 'none',
    cinema: 'contrast(1.25) saturate(1.2)',
    vintage: 'sepia(.65) contrast(1.1)',
    bw: 'grayscale(1)',
    warm: 'sepia(.25) saturate(1.4)',
    cool: 'hue-rotate(18deg) saturate(1.15)',
    vivid: 'saturate(1.8) contrast(1.1)'
  };

  cards.forEach(card => {
    card.addEventListener('click', () => {
      cards.forEach(c => c.classList.remove('active'));
      card.classList.add('active');

      const name = card.dataset.filter;
      if (video) video.style.filter = styles[name];
      document.getElementById('kbfcFilterStatus').textContent =
        'Selected: ' + card.textContent.trim();
    });
  });
})();
</script>

<div class="kbfc-effects">

  <p style="font-size:12px;color:#cbd5e1">Tap an effect to select it</p>

    </button>
    <button class="kbfc-effect-card" data-effect="glow">

    </button>
    <button class="kbfc-effect-card" data-effect="flash">
      <div class="kbfc-effect-demo flash">⚡</div>Flash
    </button>
    <button class="kbfc-effect-card" data-effect="blur">

      <div class="kbfc-effect-demo vignette">🏟️</div>Vignette
    </button>

      <div class="kbfc-effect-demo shake">⚽</div>Shake
    </button>

      <div class="kbfc-effect-demo bw">⚽</div>B&W
    </button>
    <button class="kbfc-effect-card" data-effect="slow">

    </button>
  </div>
  <p id="kbfcEffectStatus">Selected: None</p>
</div>

<script>
(function () {
  const cards = document.querySelectorAll('.kbfc-effect-card');
  const video = document.getElementById('video');

  const css = {
    none: 'none',
    glow: 'brightness(1.2) contrast(1.1)',
    flash: 'brightness(1.5)',
    blur: 'blur(2px)',
    zoom: 'none',
    vignette: 'contrast(1.2)',
    shake: 'none',
    bw: 'grayscale(1)',
    slow: 'none'
  };

  cards.forEach(card => {
    card.addEventListener('click', () => {
      cards.forEach(c => c.classList.remove('active'));
      card.classList.add('active');

      const effect = card.dataset.effect;
      if (video) video.style.filter = css[effect];

      document.getElementById('kbfcEffectStatus').textContent =
        'Selected: ' + card.textContent.trim();

  });
