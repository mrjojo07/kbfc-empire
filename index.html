<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBFC EMPIRE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #101114;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .home {
      width: 100%;
      max-width: 420px;
      padding: 35px 22px;
      background: #1b1c21;
      border: 1px solid #33343b;
      border-radius: 22px;
    }
    .ball { font-size: 58px; }
    h1 {
      margin: 14px 0 8px;
      color: #ffcc22;
      font-size: 32px;
      letter-spacing: 1px;
    }
    p {
      color: #c6c6ce;
      margin-bottom: 30px;
    }
    .open {
      display: block;
      padding: 15px;
      border-radius: 12px;
      background: #ffcc22;
      color: #111;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
    }
    .open:active { transform: scale(.98); }
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #777984;
    }
  
<style>
/* KBFC EMPIRE — Homepage animations */
@keyframes kbfcCardEnter {
  from { opacity: 0; transform: translateY(35px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes kbfcBallSpin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

@keyframes kbfcTitleReveal {
  from { opacity: 0; transform: translateY(18px); filter: blur(6px); }
  to   { opacity: 1; transform: translateY(0); filter: blur(0); }
}

@keyframes kbfcButtonGlow {
  0%, 100% { box-shadow: 0 0 0 rgba(255,204,35,0); }
  50% { box-shadow: 0 0 24px rgba(255,204,35,.42); }
}

@keyframes kbfcLightSweep {
  from { left: -80%; }
  to   { left: 130%; }
}

@keyframes kbfcParticleFloat {
  0%, 100% { transform: translateY(0); opacity: .2; }
  50% { transform: translateY(-12px); opacity: .7; }
}

/* Homepage card */
.kbfc-home-card {
  position: relative;
  overflow: hidden;
  animation: kbfcCardEnter .9s cubic-bezier(.2,.75,.25,1) both;
}

/* Football icon */
.kbfc-home-ball {
  display: inline-block;
  animation: kbfcBallSpin 8s linear infinite;
  transform-origin: center;
}

/* Brand title */
.kbfc-home-title {
  animation: kbfcTitleReveal .8s ease-out .2s both;
}

/* Open Editor button */
.kbfc-home-button {
  position: relative;
  overflow: hidden;
  animation: kbfcButtonGlow 2.8s ease-in-out infinite;
  transition: transform .2s ease, filter .2s ease;
}

.kbfc-home-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
}

.kbfc-home-button:active {
  transform: scale(.98);
}

/* Respect reduced-motion settings */
@media (prefers-reduced-motion: reduce) {
  .kbfc-home-card,
  .kbfc-home-ball,
  .kbfc-home-title,
  
.kbfc-home-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 16px 28px;
  background: #ffcc23;
  color: #111111;
  text-decoration: none;
  font-size: 18px;
  font-weight: 700;
  border: none;
  border-radius: 14px;
  animation: kbfcButtonGlow 2.8s ease-in-out infinite;
  transition: transform .2s ease, filter .2s ease;
}

.kbfc-home-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
}

.kbfc-home-button:active {
  transform: scale(.98);
}
  {
    animation: none !important;
    transition: none !important;
  }
}

.home a.kbfc-home-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 16px 28px;
  background: #ffcc23;
  color: #111 !important;
  text-decoration: none !important;
  font-size: 18px;
  font-weight: 700;
  border: none;
  border-radius: 14px;
  animation: kbfcButtonGlow 2.8s ease-in-out infinite;
}
  </style>
  </style>
</head>
<body>
  
<main class="home">
  <div class="kbfc-home-card">
    <div class="football kbfc-home-ball">⚽</div>
    <h1 class="kbfc-home-title">KBFC EMPIRE</h1>
    <p>Football Shorts Creator</p>
    <a href="editor.html" class="kbfc-home-button">Open Editor</a>
    <div class="footer">CREATE • EDIT • DOWNLOAD</div>
  </div>
</main>
</body>
</html>
